[package]
name = "enduroaudio"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { optional = true, version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui_plot = { version = "0.38.0", optional = true }
fdk-aac = "0.8.0"
rfd = { version = "0.17.2", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_plot", "dep:rfd"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# fdk-aac 0.5 kompiliert mit MinGW (LLP64) nicht: doppelte fMin/fMax-Überladungen.
# Die lokale Kopie enthält den Fix aus fdk-aac upstream (common_fix.h).
[patch.crates-io]
fdk-aac-sys = { path = "vendor/fdk-aac-sys" }
